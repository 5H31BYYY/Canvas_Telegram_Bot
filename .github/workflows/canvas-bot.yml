name: canvas-bot

on:
  schedule:
    - cron: "2,17,32,47 * * * *"   # every 15 minutes (staggered off :00)
  workflow_dispatch:          # lets you run it manually from the Actions tab

permissions:
  contents: write             # needed to save state.json back to the repo

concurrency:
  group: canvas-bot
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install -r requirements.txt

      - name: Check Canvas and notify Telegram
        run: python bot.py --once
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          CANVAS_ACCOUNTS: ${{ secrets.CANVAS_ACCOUNTS }}
          TIMEZONE: ${{ vars.TIMEZONE || 'Asia/Phnom_Penh' }}
          ASSIGNMENT_REMINDER_MINUTES: ${{ vars.ASSIGNMENT_REMINDER_MINUTES || '1440,180,60' }}
          EVENT_REMINDER_MINUTES: ${{ vars.EVENT_REMINDER_MINUTES || '30,15' }}
          QUIET_HOURS: ${{ vars.QUIET_HOURS || '' }}
          DIGEST_MODE: ${{ vars.DIGEST_MODE || 'true' }}

      - name: Save state
        run: |
          git config user.name "canvas-bot"
          git config user.email "canvas-bot@users.noreply.github.com"
          git add state.json
          git diff --cached --quiet || (git commit -m "update state" && git push)
